<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Snowflake中国合作伙伴资料站</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❄️</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body class="app-hidden">

<div id="login-overlay" class="login-overlay">
  <div class="login-box">
    <img src="https://www.snowflake.com/wp-content/themes/flavor/flavors/snowflake/assets/img/logo.svg" alt="Snowflake" width="48" height="48" class="snowflake-logo">
    <h2>Snowflake中国合作伙伴资料站</h2>
    <p>请输入访问密码</p>
    <input type="password" id="login-passcode" placeholder="访问密码" autocomplete="off">
    <button id="login-btn">进入</button>
    <p id="login-error" class="login-error" style="display:none;">密码错误，请重试</p>
  </div>
</div>

<header>
  <div class="header-inner">
    <div class="logo-area">
      <img src="https://www.snowflake.com/wp-content/themes/flavor/flavors/snowflake/assets/img/logo.svg" alt="Snowflake" width="40" height="40" class="snowflake-logo">
      <div>
        <h1>Snowflake中国合作伙伴资料站</h1>
        <p class="subtitle">Partner Resource Hub</p>
      </div>
    </div>

  </div>
</header>

<main>
  <section class="section active">
    <div class="section-header">
      <h2>常用链接</h2>
      <p class="section-desc">点击卡片直接跳转至对应平台</p>
    </div>
    <div class="link-grid" id="link-list"></div>
  </section>

  <section id="webinars" class="section active">
    <div class="section-header">
      <h2>Webinar 录屏</h2>
      <p class="section-desc">点击卡片观看 Webinar 录屏回放</p>
    </div>
    <div class="filter-bar" id="webinar-filters"></div>
    <div class="card-grid" id="webinar-list"></div>
    <div class="empty-state" id="webinar-empty" style="display:none;">
      <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="#9CA3AF" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M8 15s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>
      <p>暂无匹配的 Webinar</p>
    </div>
  </section>


</main>

<footer>
  <div class="footer-inner">
    <p>&copy; 2026 Snowflake Inc. All Rights Reserved</p>
    <p class="footer-note">本站内容仅供 Snowflake 合作伙伴参考使用</p>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
